[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yahtzee-tui"
version = "1.13.5"
description = "Yahtzee in your terminal: mouse, keyboard, and commands, with bots up to a mathematically optimal solver"
requires-python = ">=3.9"
dependencies = [
    "textual>=8.2,<9",
    # websockets.connect must be the asyncio implementation (14+).
    "websockets>=14",
]

[project.optional-dependencies]
# The solver (hints, coach, auto, hard/optimal bots). Optional because
# numpy cannot run everywhere (iSH's emulator lacks SSE); without it the
# game still plays online and against the easy/medium bots.
# 3.9 (iSH/Alpine) rides on the distro numpy (apk py3-numpy is 1.20);
# modern Pythons keep the modern floor.
solver = [
    "numpy>=1.26; python_version >= '3.10'",
    "numpy>=1.20; python_version < '3.10'",
]
dev = ["yahtzee-tui[solver]", "pytest", "pytest-asyncio", "aiohttp>=3.9"]

[project.scripts]
yahtzee = "yahtzee_app.__main__:main"

[tool.setuptools.packages.find]
include = ["yahtzee_app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
