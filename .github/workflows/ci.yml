name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu-latest (26.04) has no Python 3.9 builds; 24.04 still has them.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
